{% extends 'base.html' %}

{% block title %}Блог{% endblock %}

{% block content %}

<div class="mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Список постов</h2>
        <a href="{% url 'blog:post_create' %}" class="btn btn-primary">Создать пост</a>
    </div>

    <ul class="list-group">
        {% for post in posts %}
        <li class="list-group-item">
            <a href="{% url 'blog:post_details' post.pk %}">{{ post.title }}</a>
            <p class="mb-0 mt-1 text-muted">{{ post.content|truncatechars:100 }}</p>
        </li>
        {% empty %}
        <li class="list-group-item text-muted">
            Пока нет ни одной опубликованной записи.
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}

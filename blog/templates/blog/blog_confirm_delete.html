{% extends 'base.html' %}

{% block title %}Удаление поста{% endblock %}

{% block content %}

<div class="mt-4">
    <div class="alert alert-danger">
        <h4>Вы действительно хотите удалить пост? «{{ object.title }}»?</h4>
        <p>Это действие нельзя будет отменить.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'blog:post_details' object.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
